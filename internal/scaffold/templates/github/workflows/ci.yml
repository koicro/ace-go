name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: go mod download
      - run: make eval
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: .eval/
          if-no-files-found: ignore
